# TPM
set -g @plugin 'tmux-plugins/tpm'

# Theme
set -g @plugin 'catppuccin/tmux#v2.1.3'

# Navigation (smart-splits.nvim handles vim/tmux navigation and resizing)
# v3 moved tmux support out of smart-splits.nvim into a separate TPM plugin.
# This repo contains smart-splits.tmux, which binds the C-hjkl / M-hjkl keys
# and forwards them to Neovim when the pane is running it.
set -g @plugin 'smart-splits-nvim/backend-tmux'
# Keep in sync with `move.at_edge` in nvim/lua/custom/plugins/tmux.lua
set -g @smart-splits_at_edge 'wrap'
set -g @smart-splits_resize_step_size '5'
set -g @plugin 'sainnhe/tmux-fzf'

# Status
set -g @plugin 'tmux-plugins/tmux-battery'
set -g @plugin 'tmux-plugins/tmux-online-status'

# Session
set -g @plugin 'tmux-plugins/tmux-resurrect'

# save and restore session
# Using 'S' (Shift+s) and 'R' (Shift+r) to avoid conflicts with:
# - 's' which is tmux's default tree/session chooser
# - 'r' which is bound to reload config
set -g @resurrect-save 'S'
set -g @resurrect-restore 'R'
set -g @resurrect-capture-pane-contents 'on'

