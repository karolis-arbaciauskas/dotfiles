# reload
unbind r
bind r source-file ~/.tmux.conf \; display-message "tmux reloaded 🚀"

# kill pane (with confirmation)
bind-key x confirm-before -p "kill-pane #P? (y/n)" kill-pane

# vi mode
setw -g mode-keys vi

# copy mode
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi y send-keys -X copy-selection-and-cancel
# Copy to system clipboard (macOS)
bind-key -T copy-mode-vi Y send-keys -X copy-pipe-and-cancel "pbcopy"

# mouse selection in copy mode (stay in copy mode after selecting)
bind -T copy-mode-vi MouseDragEnd1Pane send -X copy-selection
# copy to system clipboard with double-click (macOS)
bind -T copy-mode-vi DoubleClick1Pane send -X select-word \; send -X copy-pipe-and-cancel "pbcopy"

# resizing is intentionally NOT bound here.
# smart-splits-backend-tmux binds M-hjkl itself and only resizes the tmux pane
# when the pane is not running Neovim; inside Neovim it forwards the key.
# Binding resize-pane here would override that and break nvim -> tmux edge moves.

# splits (keep cwd)
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"

# also make new windows open in current directory
bind c new-window -c "#{pane_current_path}"

# fzf
bind-key f run-shell "~/.tmux/plugins/tmux-fzf/main.sh"

# lazygit
bind-key g new-window -n git 'lazygit'
